services:
  ambra:
    # Full 完整版（默认，内置 ffmpeg + ffprobe）：target: runtime-full 或镜像 tag :latest / :full
    # Lite 轻量版（不内置 ffmpeg，~35MB Alpine，适合 STRM/302 或自挂载 ffmpeg）：target: runtime-lite 或镜像 tag :lite
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-full
    image: ghcr.io/iky002/ambra:latest
    container_name: ambra
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8096:8096/tcp"   # HTTP / Web UI / Emby API
      - "1900:1900/udp"   # DLNA / SSDP 局域网发现
    volumes:
      - ./data:/data      # 数据库、配置、元数据、图片与字幕缓存
      # 挂载本地媒体库（建议只读 :ro）
      # - /path/to/movies:/media/movies:ro
      # - /path/to/tv:/media/tv:ro
      # - /path/to/music:/media/music:ro
    environment:
      TZ: Asia/Shanghai
      # ========================================================================
      # 权限配置（NAS / 宿主机映射目录必看）
      # ========================================================================
      # 容器默认以 PUID=1000 / PGID=1000 非 root 身份运行，并会在启动时自动修正 /data 权限。
      # 若容器内无法访问映射的媒体文件夹（Permission denied），请在宿主机执行：
      #   stat -c '%u:%g' /你的媒体目录   或   id
      # 然后将 PUID / PGID 改为对应属主（如群晖常见 1026:100、Unraid 常见 99:100）：
      PUID: 1000
      PGID: 1000
      # 如需同时访问多个不同用户组的目录或硬件加速设备，可追加逗号分隔的附加组 ID 或组名：
      # GIDLIST: "100,44,109"
      # 提示：如果你挂载了多个不同属主的混合权限目录，直接将 PUID 与 PGID 均设为 0（即 0:0 root 运行）即可全部访问：
      # PUID: 0
      # PGID: 0
      # 可选：文件创建掩码（如 002 便于同组读写，默认继承宿主机）
      # UMASK: "022"
      AMBRA_HTTP_ADDR: ":8096"
      AMBRA_FFMPEG_PATH: "/usr/bin/ffmpeg"
      AMBRA_FFPROBE_PATH: "/usr/bin/ffprobe"
      # 可选：自定义 TMDB API Key（留空将自动使用内置默认密钥）
      # AMBRA_TMDB_API_KEY: "your_tmdb_api_key"
      # 可选：外部 Web UI 目录覆盖内嵌前端
      # AMBRA_WEB_DIR: "/web"
    # ==========================================================================
    # 硬件加速转码配置（按需取消注释）
    # ==========================================================================
    # Intel QSV / AMD VAAPI（Linux 宿主机）：
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "video"
    #   - "render"
    #
    # NVIDIA NVENC（需宿主机安装 nvidia-container-toolkit）：
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu, video]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/System/Ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
