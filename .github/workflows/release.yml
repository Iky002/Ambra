name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0) when triggered manually'
        required: true
        default: ''

permissions:
  contents: read

jobs:
  release-binaries:
    name: Build & Publish Release Binaries (Lite + Full w/ FFmpeg)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build embedded Web UI (web/dist)
        run: cd web && npm ci && npm run build

      - name: Setup Go 1.26
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true

      - name: Cross-compile Lite single-file binaries (without FFmpeg)
        id: build-lite
        env:
          RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: invalid release tag '${RELEASE_TAG}'" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "docs/releases/${RELEASE_TAG}.md" ]; then
            echo "notes=docs/releases/${RELEASE_TAG}.md" >> "$GITHUB_OUTPUT"
          fi
          mkdir -p dist/lite dist/full
          AMBRA_VERSION="${RELEASE_TAG}"
          TARGETS=(
            "linux/amd64/ambra-lite-linux-amd64"
            "linux/arm64/ambra-lite-linux-arm64"
            "darwin/arm64/ambra-lite-darwin-arm64"
            "windows/amd64/ambra-lite-windows-amd64.exe"
          )
          pids=()
          for entry in "${TARGETS[@]}"; do
            IFS='/' read -r GOOS GOARCH BIN_NAME <<< "${entry}"
            (
              echo "Building ${BIN_NAME} (${GOOS}/${GOARCH}, version=${AMBRA_VERSION})..."
              CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
                go build -trimpath -ldflags="-s -w -X github.com/ambra-media/ambra/internal/config.AmbraVersion=${AMBRA_VERSION}" -o "dist/lite/${BIN_NAME}" ./cmd/ambra
            ) &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do
            wait "${pid}"
          done

      - name: Bundle Full packages WITH static FFmpeg & FFprobe
        env:
          # Pinned permanent month-end BtbN release snapshot (override via repo variable BTBN_RELEASE_TAG if updating).
          BTBN_RELEASE_TAG: ${{ vars.BTBN_RELEASE_TAG || 'autobuild-2026-10-31-12-59' }}
          BTBN_FFMPEG_BRANCH: n8.1
          BTBN_SHA256_LINUX64: ${{ vars.BTBN_SHA256_LINUX64 || '' }}
          BTBN_SHA256_LINUXARM64: ${{ vars.BTBN_SHA256_LINUXARM64 || '' }}
          BTBN_SHA256_WIN64: ${{ vars.BTBN_SHA256_WIN64 || '' }}
          MACOS_FFMPEG_BASE: https://ffmpeg.martin-riedl.de/download/macos/arm64/1795207104_9.1
          MACOS_FFMPEG_SHA256: 1f66e9a690a7f1c9e60b012379f8869c11818d1797f45b21dbb2f2564ba61ae1
          MACOS_FFPROBE_SHA256: 6ef2df5f575042923a28537ab37adf936f28bf3e7b85de23a1447ed447ec1dbd
        run: |
          set -euo pipefail
          if [[ ! "${BTBN_RELEASE_TAG}" =~ ^(latest|autobuild-[0-9]{4}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2})$ ]]; then
            echo "ERROR: BTBN_RELEASE_TAG must be 'latest' or 'autobuild-YYYY-MM-DD-HH-MM', got '${BTBN_RELEASE_TAG}'" >&2
            exit 1
          fi
          if [ "${BTBN_RELEASE_TAG}" = "autobuild-2026-10-31-12-59" ]; then
            BTBN_SHA256_LINUX64="${BTBN_SHA256_LINUX64:-41e9c565594c390622cf968d82fa4135d9e9a11d06c1515644288cbc844e3380}"
            BTBN_SHA256_LINUXARM64="${BTBN_SHA256_LINUXARM64:-a08c0ee6e1c4e02139344b303002dcc7c37cf125d639f1fbd15dabee40fcb525}"
            BTBN_SHA256_WIN64="${BTBN_SHA256_WIN64:-401dffcf14c301082e1fc03b0bc876b92ea676bfc521fc56e80a1537d137034f}"
          fi
          BTBN_RELEASE_BASE="https://github.com/BtbN/FFmpeg-Builds/releases/download/${BTBN_RELEASE_TAG}"
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xz-utils zip unzip file
          WORK="/tmp/ffmpeg-bundle"
          mkdir -p "${WORK}"

          # Download upstream SHA-256 manifest from pinned BtbN release once, validate its format strictly,
          # and verify every downloaded archive against it (fail-closed, no branch fallback).
          BTBN_CHECKSUMS_RAW="${WORK}/btbn-checksums.raw.sha256"
          BTBN_CHECKSUMS="${WORK}/btbn-checksums.sha256"
          curl -fsSL -o "${BTBN_CHECKSUMS_RAW}" "${BTBN_RELEASE_BASE}/checksums.sha256"
          tr -d '\r' < "${BTBN_CHECKSUMS_RAW}" > "${BTBN_CHECKSUMS}"
          if [ ! -s "${BTBN_CHECKSUMS}" ]; then
            echo "ERROR: empty BtbN checksums.sha256" >&2
            exit 1
          fi
          if grep -Evq '^[0-9a-fA-F]{64}  [A-Za-z0-9._-]+$' "${BTBN_CHECKSUMS}"; then
            echo "ERROR: malformed line detected in BtbN checksums.sha256 (fail-closed)" >&2
            exit 1
          fi
          if [ "$(grep -Ec '^[0-9a-fA-F]{64}  [A-Za-z0-9._-]+$' "${BTBN_CHECKSUMS}")" -lt 1 ]; then
            echo "ERROR: no valid SHA-256 entries found in BtbN checksums.sha256 (fail-closed)" >&2
            exit 1
          fi

          verify_sha256_strict() {
            local file_path="$1"
            local expected_sha="$2"
            local label="$3"
            if [ -z "${expected_sha}" ] || [[ ! "${expected_sha}" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "ERROR: missing or invalid expected SHA-256 for ${label}: '${expected_sha}' (fail-closed)" >&2
              exit 1
            fi
            if [ -L "${file_path}" ] || [ ! -f "${file_path}" ] || [ ! -s "${file_path}" ]; then
              echo "ERROR: missing, symlink, or empty archive ${file_path} for ${label}" >&2
              exit 1
            fi
            printf '%s  %s\n' "${expected_sha}" "${file_path}" | sha256sum --strict -c -
            local actual_sha
            actual_sha="$(sha256sum "${file_path}" | awk '{print $1}')"
            if [ -z "${actual_sha}" ] || [ "${actual_sha,,}" != "${expected_sha,,}" ]; then
              echo "ERROR: SHA-256 digest mismatch for ${label}: got '${actual_sha}', want '${expected_sha}'" >&2
              exit 1
            fi
          }

          verify_binary() {
            local bin_path="$1"
            local expected_pattern="$2"
            local min_bytes="${3:-1048576}"
            if [ -L "${bin_path}" ] || [ ! -f "${bin_path}" ] || [ ! -s "${bin_path}" ]; then
              echo "ERROR: missing, symlink, or empty binary ${bin_path}" >&2
              exit 1
            fi
            local bin_size
            bin_size="$(stat -c '%s' "${bin_path}")"
            if [ "${bin_size}" -lt "${min_bytes}" ]; then
              echo "ERROR: truncated binary ${bin_path} (${bin_size} bytes < ${min_bytes})" >&2
              exit 1
            fi
            local info
            info="$(file -b "${bin_path}")"
            if ! echo "${info}" | grep -Eiq "${expected_pattern}"; then
              echo "ERROR: unexpected binary format for ${bin_path}: ${info}" >&2
              exit 1
            fi
            sha256sum "${bin_path}"
          }

          bundle_btbn() {
            local platform="$1"
            local arch_tag="$2"
            local ext="$3"
            local lite_bin="$4"
            local out_archive="$5"
            local is_win="$6"
            local expected_file_re="$7"
            local pinned_sha="$8"

            verify_binary "${lite_bin}" "${expected_file_re}" 1048576

            local stage="${WORK}/${platform}"
            mkdir -p "${stage}/pkg"

            # Resolve exact pinned release branch archive name + SHA256 from upstream checksums.sha256.
            # Fail closed immediately if the exact BTBN_FFMPEG_BRANCH target is missing, empty, or ambiguous.
            local branch_ver="${BTBN_FFMPEG_BRANCH#n}"
            local branch_ver_re="${branch_ver//./\\.}"
            local matches
            matches="$(grep -E "^[0-9a-fA-F]{64}  ffmpeg-${BTBN_FFMPEG_BRANCH//./\\.}[.-][A-Za-z0-9._-]+-${arch_tag}-gpl-${branch_ver_re}\.${ext}$" "${BTBN_CHECKSUMS}" || true)"
            if [ -z "${matches}" ]; then
              echo "ERROR: missing ${BTBN_FFMPEG_BRANCH} archive entry for ${platform} in checksums.sha256 (fail-closed)" >&2
              exit 1
            fi
            local match_count
            match_count="$(printf '%s\n' "${matches}" | grep -c '^')"
            if [ "${match_count}" != "1" ]; then
              echo "ERROR: expected exactly 1 ${BTBN_FFMPEG_BRANCH} archive entry for ${platform} in checksums.sha256, found ${match_count} (fail-closed)" >&2
              exit 1
            fi

            local expected_sha asset_name
            expected_sha="$(printf '%s\n' "${matches}" | awk '{print $1}')"
            asset_name="$(printf '%s\n' "${matches}" | awk '{print $2}')"
            if [ -z "${expected_sha}" ] || [ -z "${asset_name}" ] || [[ ! "${expected_sha}" =~ ^[0-9a-fA-F]{64}$ ]] || [[ ! "${asset_name}" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "ERROR: invalid checksum manifest entry for ${platform}: ${matches}" >&2
              exit 1
            fi
            if [ -n "${pinned_sha}" ]; then
              if [[ ! "${pinned_sha}" =~ ^[0-9a-fA-F]{64}$ ]]; then
                echo "ERROR: invalid pinned SHA-256 format for ${platform}: ${pinned_sha}" >&2
                exit 1
              fi
              if [ "${expected_sha,,}" != "${pinned_sha,,}" ]; then
                echo "ERROR: upstream SHA-256 mismatch against pinned digest for ${platform}: got ${expected_sha}, want ${pinned_sha}" >&2
                exit 1
              fi
            fi
            local archive_path="${stage}/${asset_name}"

            echo "Downloading ${asset_name} for ${platform} (tag=${BTBN_RELEASE_TAG}, sha256=${expected_sha})..."
            curl -fsSL -o "${archive_path}" "${BTBN_RELEASE_BASE}/${asset_name}"
            verify_sha256_strict "${archive_path}" "${expected_sha}" "${platform}/${asset_name}"

            if [ "${is_win}" = "1" ]; then
              unzip -q "${archive_path}" -d "${stage}/extract"
              local found_ffmpeg found_ffprobe
              found_ffmpeg="$(find "${stage}/extract" -type f -name 'ffmpeg.exe' | head -n 1)"
              found_ffprobe="$(find "${stage}/extract" -type f -name 'ffprobe.exe' | head -n 1)"
              if [ -z "${found_ffmpeg}" ] || [ -z "${found_ffprobe}" ]; then
                echo "ERROR: ffmpeg.exe or ffprobe.exe missing from ${asset_name}" >&2
                exit 1
              fi
              cp "${lite_bin}" "${stage}/pkg/ambra.exe"
              cp "${found_ffmpeg}" "${stage}/pkg/ffmpeg.exe"
              cp "${found_ffprobe}" "${stage}/pkg/ffprobe.exe"
              verify_binary "${stage}/pkg/ffmpeg.exe" "${expected_file_re}" 1048576
              verify_binary "${stage}/pkg/ffprobe.exe" "${expected_file_re}" 1048576
              (cd "${stage}/pkg" && zip -q -r "${GITHUB_WORKSPACE}/dist/full/${out_archive}" .)
            else
              tar -xJf "${archive_path}" -C "${stage}" --one-top-level=extract
              local found_ffmpeg found_ffprobe
              found_ffmpeg="$(find "${stage}/extract" -type f -name 'ffmpeg' | head -n 1)"
              found_ffprobe="$(find "${stage}/extract" -type f -name 'ffprobe' | head -n 1)"
              if [ -z "${found_ffmpeg}" ] || [ -z "${found_ffprobe}" ]; then
                echo "ERROR: ffmpeg or ffprobe missing from ${asset_name}" >&2
                exit 1
              fi
              cp "${lite_bin}" "${stage}/pkg/ambra"
              cp "${found_ffmpeg}" "${stage}/pkg/ffmpeg"
              cp "${found_ffprobe}" "${stage}/pkg/ffprobe"
              chmod +x "${stage}/pkg/ambra" "${stage}/pkg/ffmpeg" "${stage}/pkg/ffprobe"
              verify_binary "${stage}/pkg/ffmpeg" "${expected_file_re}" 1048576
              verify_binary "${stage}/pkg/ffprobe" "${expected_file_re}" 1048576
              tar -czf "${GITHUB_WORKSPACE}/dist/full/${out_archive}" -C "${stage}/pkg" .
            fi
          }

          bundle_macos() {
            local stage="${WORK}/darwin-arm64"
            mkdir -p "${stage}/pkg"
            echo "Downloading pinned FFmpeg/FFprobe for darwin-arm64..."
            cp "dist/lite/ambra-lite-darwin-arm64" "${stage}/pkg/ambra"
            for pair in "ffmpeg:${MACOS_FFMPEG_SHA256}" "ffprobe:${MACOS_FFPROBE_SHA256}"; do
              local tool="${pair%%:*}"
              local expected_sha="${pair#*:}"
              curl -fsSL -o "${stage}/${tool}.zip" "${MACOS_FFMPEG_BASE}/${tool}.zip"
              verify_sha256_strict "${stage}/${tool}.zip" "${expected_sha}" "darwin-arm64/${tool}.zip"
              unzip -q "${stage}/${tool}.zip" -d "${stage}/pkg"
            done
            chmod +x "${stage}/pkg/ambra" "${stage}/pkg/ffmpeg" "${stage}/pkg/ffprobe"
            verify_binary "${stage}/pkg/ffmpeg" "Mach-O.*arm64"
            verify_binary "${stage}/pkg/ffprobe" "Mach-O.*arm64"
            tar -czf "${GITHUB_WORKSPACE}/dist/full/ambra-full-darwin-arm64.tar.gz" -C "${stage}/pkg" .
          }

          # Run all 4 platform FFmpeg downloads, checksum verifications & packaging in parallel
          pids=()
          bundle_btbn "linux-amd64" "linux64" "tar.xz" \
            "dist/lite/ambra-lite-linux-amd64" \
            "ambra-full-linux-amd64.tar.gz" "0" "ELF.*x86-64" "${BTBN_SHA256_LINUX64}" &
          pids+=($!)

          bundle_btbn "linux-arm64" "linuxarm64" "tar.xz" \
            "dist/lite/ambra-lite-linux-arm64" \
            "ambra-full-linux-arm64.tar.gz" "0" "ELF.*aarch64" "${BTBN_SHA256_LINUXARM64}" &
          pids+=($!)

          bundle_btbn "windows-amd64" "win64" "zip" \
            "dist/lite/ambra-lite-windows-amd64.exe" \
            "ambra-full-windows-amd64.zip" "1" "PE32\+" "${BTBN_SHA256_WIN64}" &
          pids+=($!)

          bundle_macos &
          pids+=($!)

          for pid in "${pids[@]}"; do
            wait "${pid}"
          done

      - name: Consolidate artifacts & generate SHA256SUMS
        run: |
          mkdir -p dist/release
          cp dist/lite/* dist/full/* dist/release/
          cd dist/release
          sha256sum ambra-* > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-binaries
          path: dist/release/*
          if-no-files-found: error
          retention-days: 7

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.build-lite.outputs.version }}
          prerelease: ${{ steps.build-lite.outputs.prerelease == 'true' }}
          body_path: ${{ steps.build-lite.outputs.notes }}
          generate_release_notes: true
          files: dist/release/*

  publish-ghcr:
    name: Build & Push Multi-Arch GHCR (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            target: runtime-full
          - variant: lite
            target: runtime-lite
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release tag
        id: validate-tag
        env:
          RELEASE_TAG: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: invalid release tag '${RELEASE_TAG}'" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          IS_PRERELEASE=false
          if [[ "${RELEASE_TAG}" == *-* ]]; then
            IS_PRERELEASE=true
          fi
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<EOF"
            if [ "${VARIANT}" = "full" ]; then
              echo "type=semver,pattern={{version}},value=${RELEASE_TAG}"
              echo "type=semver,pattern={{version}}-full,value=${RELEASE_TAG}"
              echo "type=sha,prefix=sha-"
              if [ "${IS_PRERELEASE}" = "false" ]; then
                echo "type=semver,pattern={{major}}.{{minor}},value=${RELEASE_TAG}"
                echo "type=semver,pattern={{major}},value=${RELEASE_TAG}"
                echo "type=raw,value=latest"
                echo "type=raw,value=full"
              fi
            else
              echo "type=semver,pattern={{version}}-lite,value=${RELEASE_TAG}"
              echo "type=sha,prefix=sha-,suffix=-lite"
              if [ "${IS_PRERELEASE}" = "false" ]; then
                echo "type=semver,pattern={{major}}.{{minor}}-lite,value=${RELEASE_TAG}"
                echo "type=raw,value=lite"
              fi
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata (${{ matrix.variant }})
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          context: git
          images: ghcr.io/${{ github.repository }}
          tags: ${{ steps.validate-tag.outputs.tags }}

      - name: Build and push multi-arch image (${{ matrix.variant }})
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            AMBRA_VERSION=${{ steps.validate-tag.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=min,scope=${{ matrix.variant }}
