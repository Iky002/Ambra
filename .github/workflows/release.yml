name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional release tag (e.g. v1.0.0) when triggered manually'
        required: false
        default: ''

jobs:
  release-binaries:
    name: Build & Publish Release Binaries (Lite + Full w/ FFmpeg)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build embedded Web UI (web/dist)
        run: cd web && npm ci && npm run build

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Cross-compile Lite single-file binaries (without FFmpeg)
        run: |
          mkdir -p dist/lite dist/full
          TARGETS=(
            "linux/amd64/ambra-lite-linux-amd64"
            "linux/arm64/ambra-lite-linux-arm64"
            "darwin/arm64/ambra-lite-darwin-arm64"
            "windows/amd64/ambra-lite-windows-amd64.exe"
          )
          for entry in "${TARGETS[@]}"; do
            IFS='/' read -r GOOS GOARCH BIN_NAME <<< "${entry}"
            echo "Building ${BIN_NAME} (${GOOS}/${GOARCH})..."
            CGO_ENABLED=0 GOOS="${GOOS}" GOARCH="${GOARCH}" \
              go build -trimpath -ldflags="-s -w" -o "dist/lite/${BIN_NAME}" ./cmd/ambra
          done

      - name: Bundle Full packages WITH static FFmpeg & FFprobe
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y --no-install-recommends xz-utils zip unzip
          WORK="/tmp/ffmpeg-bundle"
          mkdir -p "${WORK}"

          bundle_btbn() {
            local platform="$1"
            local url="$2"
            local lite_bin="$3"
            local out_archive="$4"
            local is_win="$5"

            local stage="${WORK}/${platform}"
            mkdir -p "${stage}/pkg"
            echo "Downloading FFmpeg for ${platform}..."
            if [ "${is_win}" = "1" ]; then
              curl -fsSL -o "${stage}/ffmpeg.zip" "${url}"
              unzip -q "${stage}/ffmpeg.zip" -d "${stage}/extract"
              cp "${lite_bin}" "${stage}/pkg/ambra.exe"
              cp "$(find "${stage}/extract" -name 'ffmpeg.exe' | head -n 1)" "${stage}/pkg/ffmpeg.exe"
              cp "$(find "${stage}/extract" -name 'ffprobe.exe' | head -n 1)" "${stage}/pkg/ffprobe.exe"
              (cd "${stage}/pkg" && zip -q -r "${GITHUB_WORKSPACE}/dist/full/${out_archive}" .)
            else
              curl -fsSL -o "${stage}/ffmpeg.tar.xz" "${url}"
              tar -xJf "${stage}/ffmpeg.tar.xz" -C "${stage}" --one-top-level=extract
              cp "${lite_bin}" "${stage}/pkg/ambra"
              cp "$(find "${stage}/extract" -type f -name 'ffmpeg' | head -n 1)" "${stage}/pkg/ffmpeg"
              cp "$(find "${stage}/extract" -type f -name 'ffprobe' | head -n 1)" "${stage}/pkg/ffprobe"
              chmod +x "${stage}/pkg/ambra" "${stage}/pkg/ffmpeg" "${stage}/pkg/ffprobe"
              tar -czf "${GITHUB_WORKSPACE}/dist/full/${out_archive}" -C "${stage}/pkg" .
            fi
          }

          # Linux amd64 & arm64 + Windows amd64 from BtbN/FFmpeg-Builds (GPL static builds)
          bundle_btbn "linux-amd64" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" \
            "dist/lite/ambra-lite-linux-amd64" \
            "ambra-full-linux-amd64.tar.gz" "0"

          bundle_btbn "linux-arm64" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz" \
            "dist/lite/ambra-lite-linux-arm64" \
            "ambra-full-linux-arm64.tar.gz" "0"

          bundle_btbn "windows-amd64" \
            "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" \
            "dist/lite/ambra-lite-windows-amd64.exe" \
            "ambra-full-windows-amd64.zip" "1"

          # macOS arm64 static ffmpeg + ffprobe (Martin Riedl / evermeet static builds)
          STAGE_MAC="${WORK}/darwin-arm64"
          mkdir -p "${STAGE_MAC}/pkg"
          cp "dist/lite/ambra-lite-darwin-arm64" "${STAGE_MAC}/pkg/ambra"
          curl -fsSL -o "${STAGE_MAC}/ffmpeg.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffmpeg.zip"
          curl -fsSL -o "${STAGE_MAC}/ffprobe.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/ffprobe.zip"
          unzip -q "${STAGE_MAC}/ffmpeg.zip" -d "${STAGE_MAC}/pkg"
          unzip -q "${STAGE_MAC}/ffprobe.zip" -d "${STAGE_MAC}/pkg"
          chmod +x "${STAGE_MAC}/pkg/ambra" "${STAGE_MAC}/pkg/ffmpeg" "${STAGE_MAC}/pkg/ffprobe"
          tar -czf "${GITHUB_WORKSPACE}/dist/full/ambra-full-darwin-arm64.tar.gz" -C "${STAGE_MAC}/pkg" .

      - name: Consolidate artifacts & generate SHA256SUMS
        run: |
          mkdir -p dist/release
          cp dist/lite/* dist/full/* dist/release/
          cd dist/release
          sha256sum ambra-* > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/release/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/release/*

  publish-ghcr:
    name: Build & Push Multi-Arch GHCR (${{ matrix.variant }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: full
            target: runtime-full
            tags: |
              type=semver,pattern={{version}}
              type=semver,pattern={{version}}-full
              type=semver,pattern={{major}}.{{minor}}
              type=semver,pattern={{major}}
              type=sha,prefix=sha-
              type=raw,value=latest
              type=raw,value=full
          - variant: lite
            target: runtime-lite
            tags: |
              type=semver,pattern={{version}}-lite
              type=semver,pattern={{major}}.{{minor}}-lite
              type=sha,prefix=sha-,suffix=-lite
              type=raw,value=lite
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (${{ matrix.variant }})
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ matrix.tags }}

      - name: Build and push multi-arch image (${{ matrix.variant }})
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
