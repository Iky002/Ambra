name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-test-build:
    name: Web Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install, test and build Web UI (Production & Demo)
        run: cd web && npm ci && npm run test && npm run build && npm run build:demo

      - name: Upload web/dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  go-test-compat:
    name: Go Test, Coverage & Compat Suite
    needs: web-test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download web/dist artifact
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run Go unit tests with race detector and coverage
        run: go test -count=1 -race -coverprofile=coverage.out ./internal/...

      - name: Enforce >= 90% coverage gate
        run: |
          TOTAL_COV=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total ./internal/... coverage: ${TOTAL_COV}%"
          awk -v cov="${TOTAL_COV}" 'BEGIN {
            if (cov + 0 < 90.0) {
              printf "ERROR: coverage %.1f%% is below required 90.0%% gate\n", cov
              exit 1
            }
          }'

      - name: Run full compatibility and contract test suite
        run: go test -v -count=1 ./tests/compat/...

  docker-check:
    name: Docker Build Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [runtime-full, runtime-lite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Dockerfile build (${{ matrix.target }}, no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
