name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web-test-build:
    name: Web Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install, test and build Web UI (Production & Demo)
        run: cd web && npm ci && npm run test && npm run build && npm run build:demo

      - name: Upload web/dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  go-test-compat:
    name: Go Test, Coverage & Compat Suite
    needs: web-test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download web/dist artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: web/dist

      - name: Setup Go 1.26
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run Go unit tests with race detector and coverage
        run: |
          set -o pipefail
          if ! go test -count=1 -race -coverprofile=coverage.out ./internal/... 2>&1 | tee /tmp/go-unit.log; then
            grep -E '(--- FAIL:|^FAIL[[:space:]]|WARNING: DATA RACE|^panic:)' /tmp/go-unit.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Enforce >= 90% coverage gate
        run: |
          TOTAL_COV=$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')
          echo "Total ./internal/... coverage: ${TOTAL_COV}%"
          awk -v cov="${TOTAL_COV}" 'BEGIN {
            if (cov + 0 < 90.0) {
              printf "::error::coverage %.1f%% is below required 90.0%% gate\n", cov
              exit 1
            }
          }'

      - name: Run full compatibility and contract test suite
        run: |
          set -o pipefail
          if ! go test -v -count=1 ./tests/compat/... 2>&1 | tee /tmp/go-compat.log; then
            grep -E '(--- FAIL:|^FAIL[[:space:]]|^panic:)' /tmp/go-compat.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

  docker-check:
    name: Docker Build Check (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [runtime-full, runtime-lite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Test Docker entrypoint script
        run: sh docker/entrypoint_test.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Verify Dockerfile build (${{ matrix.target }}, no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=min,scope=${{ matrix.target }}
